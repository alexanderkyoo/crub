[build-system]
requires = ["setuptools>=77.0.0", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "crub"
version = "0.1.1"
description = "crub - CLI for AI-assisted development with PR workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Alex Yoo", email = "alkyyo03@gmail.com"}
]
keywords = ["code-review", "ai", "github", "cli", "pull-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyGithub>=2.0.0",
    "keyring>=24.0.0",
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/alexanderkyoo/crub"
Repository = "https://github.com/alexanderkyoo/crub"
Issues = "https://github.com/alexanderkyoo/crub/issues"

[project.scripts]
crub = "crub.cli:main"

[tool.setuptools.package-data]
crub = ["AGENT_GUIDE.md"]
